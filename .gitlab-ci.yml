test:
  image: python:3.12
  stage: test
  before_script:
    - pip install -r requirements.txt --extra-index-url https://glpat:glpat-S8CVCE2QtMPsVgXdu89J@git.rwth-aachen.de/api/v4/projects/102532/packages/pypi/simple --extra-index-url https://download.pytorch.org/whl/cpu
    - pip install coverage
    - pip install pytest
  script:
    - python -m coverage run -m pytest --junitxml=report.xml
    - coverage html
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - htmlcov/
    expire_in: 2 weeks

# deploy coverage report
pages:
  image: python:3.12
  stage: deploy
  rules:
    - when: always
  dependencies:
    - test
  script:
    - mv htmlcov/ public/
  artifacts:
    paths:
      - public/
