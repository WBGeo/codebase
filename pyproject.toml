[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-requirements-txt"]
build-backend = "hatchling.build"
[project]
name = "wbgeo"
dynamic = ["version", "dependencies"]
description = "The codebase of wbgeo"
readme = "README.md"
requires-python = ">=3.12.4"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
]

[project.urls]
Homepage = "https://wbgeo.github.io/"
Reference = "https://wbgeo.github.io/reference/"


[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
# Package/build only the core directory.
packages = ["core"]

[tool.coverage.run]
# Measure only the coverage of the core directory.
source = ["core"]
